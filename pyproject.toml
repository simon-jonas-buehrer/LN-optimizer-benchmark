[project]
name = "asic-scaling-laws"
version = "0.1.0"
description = "How different optimizers and models scale in ASIC gate count for MNIST and CIFAR10 classification."
readme = "README.md"
requires-python = ">=3.10"

# The harness is numpy-only; training the neural methods needs torch; the plots need matplotlib.
dependencies = ["numpy>=1.24", "torch>=2.2", "matplotlib>=3.7"]

# Measuring circuits also needs yosys + ABC (with the sky130 liberty only for the optional GE
# metric); these are not pip-installable:
#   conda create -n eda -c conda-forge -c litex-hub yosys open_pdks.sky130a
# See docs/REPRODUCE.md.

[tool.uv]
package = false
